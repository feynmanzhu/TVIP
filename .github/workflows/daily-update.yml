name: daily-update

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare source playlists
        run: python scripts/update.py
      - name: Commit delta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channels.m3u data
          if git diff --cached --quiet; then
            echo "no playlist changes"
            exit 0
          fi
          message=$(python -c "import json; print(json.load(open('data/last-update.json', encoding='utf-8'))['commit_message'])")
          git commit -m "$message"
          git push
